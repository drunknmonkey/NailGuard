<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tawel Hinweis</title>
    <link rel="stylesheet" href="./hint-overlay.css" />
  </head>
  <body>
    <div id="hintOverlay" data-style="lavender-vignette" data-intensity="2" aria-hidden="true">
      <div class="hint-layer hint-vignette hint-terminal"></div>
      <div class="hint-layer hint-focus hint-terminal"></div>
      <div class="hint-layer hint-desaturate hint-terminal"></div>
      <div class="hint-layer hint-ambient hint-terminal"></div>
      <div class="hint-layer hint-combo">
        <span class="hint-combo-color"></span>
        <span class="hint-combo-focus hint-terminal"></span>
      </div>
    </div>
    <script src="./hint-overlay.js"></script>
  </body>
</html>
