# Baut die unsignierte macOS-.app/.dmg der bestehenden Tauri-Hülle für
# Spike- und Alpha-Branches. Das Artefakt liegt nach dem Lauf unter
# "Actions -> dieser Run -> Artifacts".
name: Tawel macOS Alpha Build

on:
  workflow_dispatch:
  push:
    branches:
      - claude/spike-tauri-nailguard-tqlfm1
      - "agent/mac-alpha-*"
    paths:
      - "src-tauri/**"
      - "spike/**"
      - "app/**"
      - ".github/workflows/spike-mac-build.yml"

concurrency:
  group: tawel-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Render Mac interface
        run: bash spike/check-mac-layout.sh
      - name: Verify hint fade in browser
        run: node spike/check-hint-rendering.js "$RUNNER_TEMP/tawel-ui-preview/node_modules/playwright"
      - name: Upload interface previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tawel-UI-Preview
          path: ${{ runner.temp }}/tawel-ui-preview/*.png
          if-no-files-found: error
  build:
    # macOS 14 (Sonoma) – nötig für backgroundThrottling-Support.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Mac alpha bridge
        run: |
          bash spike/build-frontend.sh
          node spike/mac.test.js
          node --check spike/mac.js
          node --check spike/mac-i18n.js
          node --check spike/alpha.js
          node --check spike/hint-overlay.js
          node spike/alpha.test.js
          node spike/alpha-frontend.test.js
          node --check spike/diagnostics.js
          node spike/diagnostics.test.js
          node spike/hint-overlay.test.js

      - name: Test native health status
        run: |
          rustc --test src-tauri/src/native_health.rs -o /tmp/tawel-health-tests
          /tmp/tawel-health-tests

      - name: Test native proximity logic
        run: |
          swiftc spike/native/CameraChoice.swift spike/native/ProximityGate.swift spike/native/ReviewStore.swift spike/native/DetectionPolicy.swift spike/native/GateTests.swift -o /tmp/tawel-native-tests
          /tmp/tawel-native-tests
          swiftc spike/native/DetectionPolicy.swift spike/native/AnalysisFrame.swift spike/native/AnalysisFrameTests.swift -o /tmp/tawel-analysis-tests
          /tmp/tawel-analysis-tests
          swiftc spike/native/PreviewMailbox.swift spike/native/PreviewMailboxTests.swift -o /tmp/tawel-preview-tests
          /tmp/tawel-preview-tests

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2.11.4

      - name: Resolve Rust dependencies
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Generate app icons
        run: tauri icon app/icons/icon-512.png

      - name: Build unsigned bundle
        run: tauri build
        env:
          # Unsigniert: keine Apple-Signatur/Notarisierung.
          APPLE_SIGNING_IDENTITY: "-"
          TAWEL_BUILD_SHA: ${{ github.sha }}

      - name: Inspect bundle (Kamera-Diagnose)
        run: |
          set -x
          APP=$(/usr/bin/find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          echo '--- NSCameraUsageDescription ---'
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Contents/Info.plist" || echo "NSCameraUsageDescription FEHLT"
          echo '--- codesign + entitlements ---'
          codesign -dvvv --entitlements :- "$APP" 2>&1 || true

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Tawel-macOS-Alpha
          if-no-files-found: error
          path: |
            src-tauri/Cargo.lock
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
