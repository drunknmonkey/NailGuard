[package]
name = "tawel-alpha"
version = "0.1.3"
description = "Private Tawel-Mac-Alpha auf Basis der bestehenden Tauri-2-Hülle."
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# macOS: WKUIDelegate-Kamera-Grant (Versionen wie wry, damit objc2 vereinheitlicht wird).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[profile.release]
opt-level = "s"
